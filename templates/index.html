<!DOCTYPE html>
<html>
<head>
  <title>YOLOv11 Mobile & PC Segmentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      background-color: #000; 
      color: white; 
      font-family: Arial, sans-serif; 
      overflow: hidden;
      height: 100vh;
      position: relative;
    }
    
    .container {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    
    #segmentationOutput {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    #controls {
      position: fixed;
      bottom: 20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 15px;
      z-index: 100;
      padding: 0 20px;
      flex-wrap: wrap;
    }
    
    button {
      background-color: #0f62fe; 
      border: none; 
      color: white; 
      padding: 12px 20px;
      font-size: 14px; 
      border-radius: 25px; 
      cursor: pointer;
      min-width: 100px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    
    button:hover { 
      background-color: #0353e9; 
      transform: scale(1.05);
    }
    
    button:disabled {
      background-color: #666;
      cursor: not-allowed;
      transform: none;
    }
    
    #stopBtn {
      background-color: #ff4444;
    }
    
    #stopBtn:hover {
      background-color: #cc0000;
    }
    
    #qualityBtn {
      background-color: #00c851;
    }
    
    #qualityBtn:hover {
      background-color: #007e33;
    }
    
    .status {
      position: fixed;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      z-index: 100;
      font-size: 14px;
    }
    
    .legend {
      position: fixed;
      top: 60px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
      z-index: 100;
      font-size: 12px;
      max-width: 200px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
    }
    
    .color-box {
      width: 15px;
      height: 15px;
      margin-right: 8px;
      border-radius: 3px;
    }
    
    .fps-counter {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 8px 12px;
      border-radius: 8px;
      z-index: 100;
      font-size: 12px;
      font-family: monospace;
    }
    
    .camera-select {
      position: fixed;
      top: 60px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 8px;
      z-index: 100;
      font-size: 12px;
    }
    
    select {
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px;
      margin-left: 5px;
    }
    
    @media (max-width: 768px) {
      button {
        padding: 15px 25px;
        font-size: 16px;
        min-width: 120px;
      }
      
      .legend {
        font-size: 11px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="status" id="status">Click Start Camera to begin</div>
  <div class="fps-counter" id="fpsCounter">FPS: 0</div>
  
  <div class="legend" id="legend">
    <div class="legend-item"><div class="color-box" style="background-color: rgb(255,99,71)"></div>Crack</div>
    <div class="legend-item"><div class="color-box" style="background-color: rgb(0,191,255)"></div>Dent</div>
    <div class="legend-item"><div class="color-box" style="background-color: rgb(255,215,0)"></div>Glass Shatter</div>
    <div class="legend-item"><div class="color-box" style="background-color: rgb(255,165,0)"></div>Lamp Broken</div>
    <div class="legend-item"><div class="color-box" style="background-color: rgb(147,112,219)"></div>Scratch</div>
    <div class="legend-item"><div class="color-box" style="background-color: rgb(50,205,50)"></div>Tire Flat</div>
  </div>
  
  <div class="camera-select" id="cameraSelect" style="display: none;">
    <label for="cameraList">Camera:</label>
    <select id="cameraList"></select>
  </div>
  
  <div class="container">
    <video id="video" autoplay playsinline></video>
    <img id="segmentationOutput" />
  </div>
  
  <div id="controls">
    <button id="startBtn" onclick="startCamera()">Start Camera</button>
    <button id="stopBtn" onclick="stopCamera()" disabled>Stop</button>
    <button id="switchBtn" onclick="switchCamera()" disabled>Switch</button>
    <button id="qualityBtn" onclick="toggleQuality()">Speed Mode</button>
  </div>
  <!-- <script src="/script.js"></script> -->
  <script src="/static/script.js"></script>

</body>
</html>
