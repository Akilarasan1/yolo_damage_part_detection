<!-- templates/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YOLO Live Segmentation</title>
  <style>
    body { background:#111; color:#fff; font-family:system-ui,Arial; text-align:center; padding:12px; }
    h1 { margin:8px 0 12px 0; font-size:18px; }
    #controls { margin-bottom:12px; }
    button { margin:6px; padding:10px 16px; font-size:14px; border-radius:8px; border:none; background:#0a84ff; color:#fff; }
    button:active { transform:translateY(1px); }
    #seg { width:100%; max-width:720px; border-radius:10px; margin-top:10px; background:#222; }
    #status { margin-top:8px; font-size:13px; color:#ddd; }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 10px 0; }
    .legend-item { display: flex; align-items: center; margin: 0 5px; }
    .legend-color { width: 20px; height: 20px; margin-right: 5px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>YOLO Live Segmentation - Colored Masks</h1>

  <!-- Color Legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: #0000ff;"></div>Crack (Red)</div>
    <div class="legend-item"><div class="legend-color" style="background: #ffff00;"></div>Dent (Yellow)</div>
    <div class="legend-item"><div class="legend-color" style="background: #ff0000;"></div>Glass Shatter (Blue)</div>
    <div class="legend-item"><div class="legend-color" style="background: #ff00ff;"></div>Lamp Broken (Magenta)</div>
    <div class="legend-item"><div class="legend-color" style="background: #00ff00;"></div>Scratch (Green)</div>
    <div class="legend-item"><div class="legend-color" style="background: #00ffff;"></div>Tire Flat (Cyan)</div>
  </div>

  <div id="controls">
    <button id="startFront">Start Front Camera</button>
    <button id="startBack">Start Back Camera</button>
    <button id="stopBtn">Stop</button>
    <select id="fpsSelect">
      <option value="8">120 FPS</option>
      <option value="16">60 FPS</option>
      <option value="33">30 FPS</option>
      <option value="66">15 FPS</option>
      <option value="100">10 FPS</option>
      <option value="150" selected>6.6 FPS</option>
      <option value="200">5 FPS</option>
      <option value="250">4 FPS</option>
      <option value="500">2 FPS</option>
    </select>
  </div>

  <img id="seg" alt="Segmented output will appear here" />
  <div id="status">Status: idle</div>

<script>
(() => {
  const wsProto = (location.protocol === 'https:') ? 'wss://' : 'ws://';
  const wsHost = location.host;
  const wsUrl = wsProto + wsHost + '/ws';

  let websocket = null;
  let stream = null;
  let video = null;
  let sending = false;
  let lastSendTs = 0;
  let sendInterval = 100;
  const segImg = document.getElementById('seg');
  const statusDiv = document.getElementById('status');
  const fpsSelect = document.getElementById('fpsSelect');

  fpsSelect.addEventListener('change', () => {
    sendInterval = parseInt(fpsSelect.value, 10);
  });

  function setStatus(s) { statusDiv.innerText = 'Status: ' + s; }

  async function startCamera(facingMode) {
    stopCamera();
    try {
      video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.muted = true;

      const constraints = {
        video: { facingMode: facingMode, width: { ideal: 960 }, height: { ideal: 540 } },
        audio: false
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;
      await video.play();

      openWebSocket();
      sending = true;
      setStatus('camera started (' + facingMode + ')');
      requestAnimationFrame(sendLoop);
    } catch (err) {
      console.error('startCamera error', err);
      setStatus('camera error: ' + err.message);
    }
  }

  function stopCamera() {
    sending = false;
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (websocket) {
      try { websocket.close(); } catch (e) {}
      websocket = null;
    }
    setStatus('stopped');
    segImg.src = '';
  }

  function openWebSocket() {
    if (websocket && websocket.readyState === WebSocket.OPEN) return;
    websocket = new WebSocket(wsUrl);
    websocket.binaryType = 'arraybuffer';

    websocket.onopen = () => {
      console.log('WS open');
      setStatus('connected to server');
    };

    websocket.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) {
        const arr = new Uint8Array(ev.data);
        const blob = new Blob([arr], { type: 'image/jpeg' });
        const url = URL.createObjectURL(blob);
        segImg.onload = () => URL.revokeObjectURL(url);
        segImg.src = url;
      }
    };

    websocket.onclose = () => { 
      console.log('WS closed'); 
      setStatus('ws closed'); 
    };
    
    websocket.onerror = (e) => { 
      console.error('WS error', e); 
      setStatus('ws error'); 
    };
  }

  let off = null, ctx = null;
  async function sendLoop() {
    if (!sending) return;
    if (!video || video.readyState < 2) {
      requestAnimationFrame(sendLoop);
      return;
    }

    if (!off) {
      off = new OffscreenCanvas(960, 540);
      ctx = off.getContext('2d');
    }

    const now = performance.now();
    if (now - lastSendTs >= sendInterval) {
      lastSendTs = now;
      try {
        ctx.drawImage(video, 0, 0, 940, 540);
        const blob = await off.convertToBlob({ type: 'image/jpeg', quality: 0.5 });
        if (blob && websocket?.readyState === WebSocket.OPEN) {
          const ab = await blob.arrayBuffer();
          websocket.send(ab);
        }
      } catch (err) {
        console.error('sendLoop error', err);
      }
    }
    requestAnimationFrame(sendLoop);
  }

  document.getElementById('startFront').addEventListener('click', () => startCamera('user'));
  document.getElementById('startBack').addEventListener('click', () => startCamera('environment'));
  document.getElementById('stopBtn').addEventListener('click', stopCamera);
})();
</script>

</body>
</html>
